[project]
name = "stacklang"
version = "0.1.0"
description = "快递企业智能客服后端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "sqlalchemy>=2.0.30",
    "redis>=5.0.0",
    "langgraph-checkpoint-redis>=0.1.0",
    "neo4j>=5.20.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "pypdf>=4.0.0",
    "pyjwt>=2.8.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# 项目是应用而非库，不安装为可编辑包：
# 避免 Windows 非 ASCII 项目路径被写入 .pth 后，Python 以 GBK 读取导致解码失败。
# 应用改为 `uv run python -m uvicorn app.main:app` 从源码目录运行（app 包靠 CWD 导入）。
package = false

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends/Query 等是声明式依赖注入（非可变默认参数），排除 B008
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 慢测试（加载真实模型，用 pytest --run-slow 运行）",
    "integration: 需要真实外部服务的集成测试",
]

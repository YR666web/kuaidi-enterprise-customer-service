services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      APP__ENVIRONMENT: production
      AGENT__CHECKPOINT_BACKEND: redis
      REDIS__URL: redis://redis:6379/0
      NEO4J__URI: bolt://neo4j:7687
      NEO4J__USER: neo4j
      NEO4J__PASSWORD: example-neo4j-password
      PLATFORM__RATE_LIMIT_BACKEND: redis
    command: [".venv/bin/python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    volumes:
      - ./backend/data:/app/data
      - ./models:/models:ro
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  redis:
    # LangGraph RedisSaver 需要 RedisJSON + RediSearch，普通 redis:7 不足够。
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/example-neo4j-password
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 20
